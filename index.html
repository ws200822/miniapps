<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1220">
<title>小程序合集</title>
<style>
  :root{
    --bg:#0f1220; --panel:#181c2f; --line:#232840;
    --fg:#e8ecf8; --dim:#7c86a8;
    --accent:#4ade80; --accent2:#22d3ee;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(900px 500px at 8% -10%, #1b3a2e 0%, rgba(0,0,0,0) 60%),
      radial-gradient(800px 460px at 100% 4%, #10394d 0%, rgba(0,0,0,0) 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }
  h1{font-size:24px;margin:0 0 6px;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:14px;margin-bottom:24px}
  .card{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:14px;margin-bottom:12px;
    color:inherit;text-decoration:none;
    transition:transform .12s, border-color .12s;
  }
  a.card:active{transform:scale(.985);border-color:var(--accent)}
  .card .txt{min-width:0}
  .ico{
    width:52px;height:52px;border-radius:13px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;background:#0f1220;border:1px solid var(--line);
  }
  .t{font-weight:600;font-size:16px;margin-bottom:3px}
  .d{color:var(--dim);font-size:13px}
  footer{color:var(--dim);font-size:12px;margin-top:26px;text-align:center}
  footer a{color:var(--dim)}
</style>
</head>
<body>
  <h1>小程序合集</h1>
  <div class="sub">手机优先的 HTML 小应用 · 可添加到主屏幕离线使用</div>

  <a class="card" href="./ledger/">
    <div class="ico">🧾</div>
    <div class="txt">
      <div class="t">小账本</div>
      <div class="d">数字键盘记账 · 预算进度 · 分类统计 · 数据在本地</div>
    </div>
  </a>

  <a class="card" href="./snake/">
    <div class="ico">🐍</div>
    <div class="txt">
      <div class="t">贪吃蛇</div>
      <div class="d">Canvas 渲染 · 滑动操作 · 离线可玩</div>
    </div>
  </a>

  <a class="card" href="./music/">
    <div class="ico">🎵</div>
    <div class="txt">
      <div class="t">音乐播放器</div>
      <div class="d">搜索 · 试听 · 收藏 · 锁屏控制</div>
    </div>
  </a>

  <footer>托管于 GitHub Pages</footer>
</body>
</html>
